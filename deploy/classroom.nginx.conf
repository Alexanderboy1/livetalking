# Include these locations inside your existing HTTPS server block.
# Allow external access only to this whitelist; existing demo/admin/upload APIs
# should remain available only on a trusted management network.
client_max_body_size 55m;

location ~ ^/api/(courses|classrooms)(/|$) {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
}
location /classroom {
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
}
location / {
    return 404;
}
