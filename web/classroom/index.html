<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveTalking · 数字人课堂</title><link rel="stylesheet" href="/classroom/classroom.css"></head><body>
<header><h1>LiveTalking · 数字人课堂</h1><a href="/index.html">返回数字人首页</a></header><div id="message" class="message" role="status">导入课件，准备讲稿，开始直播授课。</div>
<main><div>
<section id="setup" class="host-only"><h2>01 · 课程准备</h2><label for="key">主持人密钥（服务器环境变量 LIVETALKING_CLASSROOM_ADMIN_TOKEN）</label><div class="row"><input id="key" type="password" autocomplete="off"><button id="login" class="primary">连接控制台</button></div>
<div id="library" hidden><div class="row"><input id="file" type="file" accept=".pdf,.pptx"><button id="upload">导入 PDF / PPTX</button></div><p class="muted">最多 50 MB / 100 页。优先使用 PPT 备注作为讲稿，否则提取页内文本；图像课件请手填讲稿。</p><div class="row"><select id="courses" aria-label="选择课程"></select><button id="load">编辑课程</button></div><div id="editor" hidden><div class="row"><select id="editPage" aria-label="编辑页码"></select></div><img id="preview" alt="课件预览"><label for="script">本页讲稿（每段最多 160 字，自动分段）</label><textarea id="script" maxlength="12000"></textarea><div class="row"><button id="save">保存全部讲稿</button><button id="create" class="primary">创建课堂</button></div></div><h2>恢复课堂控制</h2><div class="row"><select id="rooms" aria-label="正在运行的课堂"></select><button id="resumeRoom">进入</button></div></div></section>
<section id="live" hidden><div class="row controls"><h2 id="title">课堂</h2><span id="state" class="badge"></span><span id="pageLabel"></span></div><div class="stage"><img id="slide" alt="当前课件"><video id="video" autoplay playsinline controls></video></div><div id="caption" class="caption" aria-live="polite"></div><div class="row controls"><button id="connect">播放 / 重连音视频</button><span id="mediaState" class="muted"></span></div><div class="host-only controls"><div class="row"><button id="start" class="primary">开始 / 继续</button><button id="pause">段末暂停</button><button id="previous">上一页</button><button id="next">下一页</button><button id="end" class="danger">结束课堂</button></div><p class="muted">暂停或跳页在当前讲解段 / 回答结束后执行。通过的问题在段落间回答，随后续讲。</p><label for="share">观众邀请链接</label><input id="share" readonly><div class="row"><a id="program" target="_blank" rel="noopener">打开纯画面（OBS 窗口采集）</a></div><label><input id="auto" type="checkbox">自动通过新问题（默认由主持人审核）</label></div></section>
</div><aside><section id="askPanel" hidden><h2>课堂提问</h2><label for="name">昵称</label><input id="name" maxlength="40" placeholder="观众"><label for="question">问题</label><textarea id="question" maxlength="500" placeholder="写下与课程有关的问题"></textarea><div class="row"><button id="ask" class="primary">提交问题</button></div><small>每个来源 IP 每 10 秒一次，最多 30 个待处理问题。通过后在讲解段落间回答。</small></section><section><h2>问答队列</h2><div id="questions" aria-live="polite"><p class="muted">进入课堂后显示问题。</p></div></section></aside></main><script src="/classroom/classroom.js" defer></script></body></html>
